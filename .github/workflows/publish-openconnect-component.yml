# Publishes the on-demand OpenConnect component bundles (macOS / Windows / Linux)
# as release assets in THIS repo, so the app's main repo release list stays clean
# (only app releases there). The desktop downloads a bundle at runtime ONLY when a
# user opts into the corporate-VPN feature — it never ships in the base installer.
#
# Each bundle is relocatable (its dynamic deps travel with the binary) so it runs
# on a machine without the toolchain installed. The download URL is stable
# (pinned tag) and the SHA-256 the job prints goes into openconnect_spec.go for
# fail-closed verification.
name: Publish — OpenConnect component

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish under: a NEW tag (released apps pin published bundles by SHA-256)"
        required: true
      platforms:
        description: "Which bundles to build and publish"
        type: choice
        options: [macos, all]
        default: macos
  pull_request:
    paths:
      - .github/workflows/publish-openconnect-component.yml
      - scripts/build-openconnect-macos.sh
      - scripts/verify-openconnect-macos.sh

permissions:
  contents: write

env:
  COMPONENT_TAG: ${{ inputs.tag }}

jobs:
  # --------------------------------------------------------------------- macOS
  # Built from source (scripts/build-openconnect-macos.sh), not from Homebrew:
  # bottles target the runner's macOS release, so a bundle made of them needed
  # macOS 14 (arm64) / 15 (Intel) while the app runs on 12+. Runs on every PR
  # that touches the recipe (build + verify, artifact only); publishes only from
  # a manual run.
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            asset: openconnect-macos-arm64.tar.gz
            title: macOS arm64
          - runner: macos-15-intel
            arch: x86_64
            asset: openconnect-macos-amd64.tar.gz
            title: macOS amd64 (Intel)
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: brew list pkgconf >/dev/null 2>&1 || brew install pkgconf
      - name: Build OpenConnect (static, macOS ${{ env.MACOSX_DEPLOYMENT_TARGET }}+)
        run: bash scripts/build-openconnect-macos.sh bundle
      - name: Verify bundle
        run: bash scripts/verify-openconnect-macos.sh bundle ${{ matrix.arch }}
      - name: Package
        run: |
          set -euo pipefail
          tar -czf "${{ matrix.asset }}" -C bundle .
          sha=$(shasum -a 256 "${{ matrix.asset }}" | awk '{print $1}')
          echo "$sha  ${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          {
            echo "### ${{ matrix.title }}"
            echo "- \`${{ matrix.asset }}\` sha256 \`$sha\` ($(ls -lh "${{ matrix.asset }}" | awk '{print $5}'))"
            echo "  BinRel: \`openconnect\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
      - name: Publish
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="${{ matrix.asset }}"
          gh release view "$COMPONENT_TAG" >/dev/null 2>&1 || gh release create "$COMPONENT_TAG"             --title "Components — OpenConnect ($COMPONENT_TAG)"             --notes "On-demand OpenConnect bundles for the corporate-VPN feature. Not an app release." --prerelease
          if gh release view "$COMPONENT_TAG" --json assets -q '.assets[].name' | grep -qx "$asset"; then
            echo "FAIL: $COMPONENT_TAG already has $asset. Released apps pin published bundles by SHA-256; publish under a new tag."; exit 1
          fi
          gh release upload "$COMPONENT_TAG" "$asset" "$asset.sha256"

  # ------------------------------------------------------------------- Windows
  # MSYS2 has no prebuilt openconnect, so build it from source (mingw) against the
  # MSYS2-provided crypto/xml deps, then bundle the exe + its DLLs + wintun.dll.
  windows:
    if: github.event_name == 'workflow_dispatch' && inputs.platforms == 'all'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            autoconf
            automake
            libtool
            gettext-devel
            unzip
            curl
            tar
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gnutls
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-nettle
            mingw-w64-x86_64-libidn2
            mingw-w64-x86_64-ntldd
      - name: Build OpenConnect from source
        run: |
          set -euo pipefail
          # NOTE: the repo checkout already occupies ./src (Rust sources), so
          # clone OpenConnect into a separate dir.
          rm -rf ocsrc
          git clone --depth 1 --branch v9.12 https://gitlab.com/openconnect/openconnect.git ocsrc
          cd ocsrc
          ./autogen.sh
          # GCC 14 (MSYS2) promotes -Wincompatible-pointer-types to an error; a
          # few Windows getsockopt/ioctl calls in v9.12 trip it (ABI-safe int* vs
          # char*), so demote it back to a warning for this build.
          ./configure --disable-nls --with-gnutls --without-openssl \
            --with-vpnc-script=vpnc-script-win.js \
            CFLAGS="-O2 -g -Wno-error=incompatible-pointer-types -Wno-error=int-conversion"
          make -j$(nproc)
          # mingw builds the exe in-tree (or under .libs); find it.
          find . -name 'openconnect.exe' -print
      - name: Assemble relocatable bundle (exe + full DLL closure + wintun)
        run: |
          # NOTE: deliberately no `set -e`/pipefail below — a leaf DLL whose ldd has
          # no further $MINGW_PREFIX deps makes grep exit 1, which under -e+pipefail
          # aborted the closure mid-way and shipped/failed on an incomplete bundle.
          set -uo pipefail
          mkdir -p bundle
          exe="$(find ocsrc -name 'openconnect.exe' -print -quit)"
          [ -n "$exe" ] || { echo "FAIL: openconnect.exe not found"; exit 1; }
          cp "$exe" bundle/openconnect.exe
          # The OpenConnect shared library is built in-tree (.libs), NOT under
          # $MINGW_PREFIX, so ldd can't find it to recurse — copy it explicitly.
          liboc="$(find ocsrc -name 'libopenconnect-5.dll' -print -quit)"
          [ -n "$liboc" ] || { echo "FAIL: libopenconnect-5.dll not built"; find ocsrc -name '*.dll'; exit 1; }
          cp "$liboc" bundle/
          # Full transitive DLL closure: with bundle/ on PATH so ldd resolves the
          # in-tree lib and recurses, pull every $MINGW_PREFIX dep into bundle/,
          # iterating until no new DLL appears (grep no-match is expected, hence
          # `|| true`).
          export PATH="$PWD/bundle:$PATH"
          for pass in 1 2 3 4 5 6 7 8; do
            new=0
            for f in bundle/*.exe bundle/*.dll; do
              deps="$(ldd "$f" 2>/dev/null | grep -F "=> $MINGW_PREFIX/" | awk '{print $3}' || true)"
              for dll in $deps; do
                base="$(basename "$dll")"
                if [ ! -f "bundle/$base" ]; then cp "$dll" bundle/ && new=1; fi
              done
            done
            echo "closure pass $pass -> $(ls -1 bundle | wc -l) files"
            [ "$new" -eq 0 ] && break
          done
          # NOTE: we deliberately DO NOT bundle wintun.dll. mihomo's core already
          # owns a wintun adapter, and two wintun users collide on Windows ("Failed
          # to register rings: already initialized"). With no wintun.dll present
          # OpenConnect falls back to OpenVPN's TAP-Windows driver (installed on
          # demand by the service) — a separate driver, so the tunnels never clash.
          echo "--- bundle contents ---"; ls -1 bundle/
          # Never ship a broken bundle: fail loudly if anything is still unresolved.
          if ldd bundle/openconnect.exe | grep -i 'not found'; then
            echo "FAIL: unresolved DLL in bundle"; exit 1
          fi
      - name: Package + hash + publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="openconnect-windows-amd64.tar.gz"
          tar -czf "$asset" -C bundle .
          sha=$(sha256sum "$asset" | awk '{print $1}')
          echo "$sha  $asset" > "$asset.sha256"
          {
            echo "### Windows amd64"
            echo "- \`$asset\` sha256 \`$sha\` ($(ls -lh "$asset" | awk '{print $5}'))"
            echo "  BinRel: \`openconnect.exe\`"
          } >> "$GITHUB_STEP_SUMMARY"
          gh release view "$COMPONENT_TAG" >/dev/null 2>&1 || gh release create "$COMPONENT_TAG" \
            --title "Components — OpenConnect ($COMPONENT_TAG)" \
            --notes "On-demand OpenConnect bundles for the corporate-VPN feature. Not an app release." --prerelease
          if gh release view "$COMPONENT_TAG" --json assets -q '.assets[].name' | grep -qx "$asset"; then
            echo "FAIL: $COMPONENT_TAG already has $asset. Released apps pin published bundles by SHA-256; publish under a new tag."; exit 1
          fi
          gh release upload "$COMPONENT_TAG" "$asset" "$asset.sha256"

  # --------------------------------------------------------------------- Linux
  linux:
    if: github.event_name == 'workflow_dispatch' && inputs.platforms == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install openconnect + patchelf
        run: sudo apt-get update && sudo apt-get install -y openconnect patchelf
      - name: Assemble relocatable bundle
        run: |
          set -euo pipefail
          mkdir -p bundle/libs
          oc="$(command -v openconnect)"
          cp "$oc" bundle/openconnect
          chmod +x bundle/openconnect
          # Bundle non-core shared libs (skip the glibc/loader core, which the
          # target already provides), then point the binary at $ORIGIN/libs.
          ldd bundle/openconnect | awk '{print $3}' | grep -E '^/' | while read -r so; do
            base="$(basename "$so")"
            case "$base" in
              libc.so*|libm.so*|libpthread.so*|libdl.so*|librt.so*|ld-linux*|libresolv.so*) continue ;;
            esac
            cp -Ln "$so" bundle/libs/ || true
          done
          patchelf --set-rpath '$ORIGIN/libs' bundle/openconnect
          echo "--- ldd after patchelf ---"; ldd bundle/openconnect || true
      - name: Package + hash + publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="openconnect-linux-amd64.tar.gz"
          tar -czf "$asset" -C bundle .
          sha=$(sha256sum "$asset" | awk '{print $1}')
          echo "$sha  $asset" > "$asset.sha256"
          {
            echo "### Linux amd64"
            echo "- \`$asset\` sha256 \`$sha\` ($(ls -lh "$asset" | awk '{print $5}'))"
            echo "  BinRel: \`openconnect\`"
          } >> "$GITHUB_STEP_SUMMARY"
          gh release view "$COMPONENT_TAG" >/dev/null 2>&1 || gh release create "$COMPONENT_TAG" \
            --title "Components — OpenConnect ($COMPONENT_TAG)" \
            --notes "On-demand OpenConnect bundles for the corporate-VPN feature. Not an app release." --prerelease
          if gh release view "$COMPONENT_TAG" --json assets -q '.assets[].name' | grep -qx "$asset"; then
            echo "FAIL: $COMPONENT_TAG already has $asset. Released apps pin published bundles by SHA-256; publish under a new tag."; exit 1
          fi
          gh release upload "$COMPONENT_TAG" "$asset" "$asset.sha256"

  # --------------------------------------------------------------- Linux arm64
  # Native arm64 runner (ubuntu-24.04-arm) so apt gives an arm64 openconnect; same
  # relocatable-bundle recipe as amd64. Ready for the Linux desktop backend (still
  # gated behind the unix-socket IPC wiring), so the bundle exists ahead of it.
  linux-arm64:
    if: github.event_name == 'workflow_dispatch' && inputs.platforms == 'all'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install openconnect + patchelf
        run: sudo apt-get update && sudo apt-get install -y openconnect patchelf
      - name: Assemble relocatable bundle
        run: |
          set -euo pipefail
          mkdir -p bundle/libs
          oc="$(command -v openconnect)"
          cp "$oc" bundle/openconnect
          chmod +x bundle/openconnect
          ldd bundle/openconnect | awk '{print $3}' | grep -E '^/' | while read -r so; do
            base="$(basename "$so")"
            case "$base" in
              libc.so*|libm.so*|libpthread.so*|libdl.so*|librt.so*|ld-linux*|libresolv.so*) continue ;;
            esac
            cp -Ln "$so" bundle/libs/ || true
          done
          patchelf --set-rpath '$ORIGIN/libs' bundle/openconnect
          echo "--- ldd after patchelf ---"; ldd bundle/openconnect || true
      - name: Package + hash + publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="openconnect-linux-arm64.tar.gz"
          tar -czf "$asset" -C bundle .
          sha=$(sha256sum "$asset" | awk '{print $1}')
          echo "$sha  $asset" > "$asset.sha256"
          {
            echo "### Linux arm64"
            echo "- \`$asset\` sha256 \`$sha\` ($(ls -lh "$asset" | awk '{print $5}'))"
            echo "  BinRel: \`openconnect\`"
          } >> "$GITHUB_STEP_SUMMARY"
          gh release view "$COMPONENT_TAG" >/dev/null 2>&1 || gh release create "$COMPONENT_TAG" \
            --title "Components — OpenConnect ($COMPONENT_TAG)" \
            --notes "On-demand OpenConnect bundles for the corporate-VPN feature. Not an app release." --prerelease
          if gh release view "$COMPONENT_TAG" --json assets -q '.assets[].name' | grep -qx "$asset"; then
            echo "FAIL: $COMPONENT_TAG already has $asset. Released apps pin published bundles by SHA-256; publish under a new tag."; exit 1
          fi
          gh release upload "$COMPONENT_TAG" "$asset" "$asset.sha256"
