# Publishes the on-demand TAP-Windows driver component for the corporate-VPN
# feature, as a release asset in THIS repo (same tag as the OpenConnect bundles).
#
# WHY a separate driver: on Windows openconnect defaults to wintun, but two wintun
# users (the mihomo core + openconnect) fight over the single wintun.sys driver
# ("Failed to register rings: already initialized"). So on Windows openconnect
# runs on OpenVPN's TAP-Windows driver instead — a separate kernel driver, so the
# two tunnels never collide. macOS/Linux use native utun/tun and need none of this.
#
# WHY repackage vs build: a kernel driver must be WHQL/EV-signed to install
# silently, which we cannot do ourselves. So we repackage OpenVPN's OFFICIALLY
# signed tap-windows6 (tap0901.cat is signed by "Microsoft Windows Hardware
# Compatibility Publisher") verbatim — it installs with no prompt under the SYSTEM
# service. The desktop fetches this on demand and, before the first corp connect,
# asks the service to `tapinstall install OemVista.inf TAP0901`.
#
# Kept in its own workflow (not the OpenConnect one) so publishing the driver does
# NOT rebuild/re-hash the OpenConnect bundles (whose SHAs are pinned in the app).
name: Publish — TAP-Windows component

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish the component under"
        required: true
        default: components-openconnect-9.21

permissions:
  contents: write

env:
  COMPONENT_TAG: ${{ inputs.tag || 'components-openconnect-9.21' }}

jobs:
  tap-windows:
    # Runs on Windows: 7-Zip on Linux (both p7zip and modern 7z 23.01) dies with
    # "Break signaled" extracting this NSIS installer, but the pre-installed
    # Windows 7-Zip handles it cleanly (verified locally on the exact file).
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      TAP_INSTALLER: tap-windows-9.24.7-I601-Win10.exe
      TAP_INSTALLER_SHA256: 1c44e77ab148ddfb174de8041100efc38c4f23500183faff88f9badac5782e3c
    steps:
      # Download + verify + extract in PWSH (native console). Running 7-Zip under
      # MSYS bash makes it die with "Break signaled" (bash forwards a spurious
      # CTRL-break to the native exe); a native shell has no such issue.
      - name: Fetch + verify + extract OpenVPN signed tap-windows6
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          curl.exe -fsSLO "https://build.openvpn.net/downloads/releases/$env:TAP_INSTALLER"
          $got = (Get-FileHash -Algorithm SHA256 $env:TAP_INSTALLER).Hash.ToLower()
          if ($got -ne $env:TAP_INSTALLER_SHA256) { throw "sha256 mismatch: $got != $env:TAP_INSTALLER_SHA256" }
          & 'C:\Program Files\7-Zip\7z.exe' x -oextracted "$env:TAP_INSTALLER" > $null
          if ($LASTEXITCODE -ne 0) { throw "7z extract failed: exit $LASTEXITCODE" }
          Get-ChildItem -Recurse extracted\driver, extracted\bin | Select-Object FullName
      - name: Package + hash + publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p bundle
          # Flat layout (verified): driver/{OemVista.inf,tap0901.sys,tap0901.cat}
          # + bin/tapinstall.exe. All WHQL/OpenVPN-signed; ship them verbatim.
          cp extracted/driver/OemVista.inf bundle/
          cp extracted/driver/tap0901.sys  bundle/
          cp extracted/driver/tap0901.cat  bundle/
          cp extracted/bin/tapinstall.exe  bundle/
          echo "--- bundle contents ---"; ls -1 bundle/
          asset="tap-windows-amd64.tar.gz"
          tar -czf "$asset" -C bundle .
          sha=$(sha256sum "$asset" | awk '{print $1}')
          echo "$sha  $asset" > "$asset.sha256"
          {
            echo "### TAP-Windows amd64 (OpenVPN WHQL-signed tap-windows6, repackaged)"
            echo "- \`$asset\` sha256 \`$sha\` ($(ls -lh "$asset" | awk '{print $5}'))"
            echo "  Source: \`$TAP_INSTALLER\` — DriverVer 9.24.7.601, HWID TAP0901"
          } >> "$GITHUB_STEP_SUMMARY"
          gh release view "$COMPONENT_TAG" >/dev/null 2>&1 || gh release create "$COMPONENT_TAG" \
            --title "Components — OpenConnect ($COMPONENT_TAG)" \
            --notes "On-demand components for the corporate-VPN feature. Not an app release." --prerelease
          gh release upload "$COMPONENT_TAG" "$asset" "$asset.sha256" --clobber
